<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangor Bites Challenge 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="game-title">🍔 Bangor Bites Challenge 🍔</h1>
            <p class="game-subtitle">Buka mulutmu untuk memakan objek!</p>
            <div class="button-group">
                <button id="start-btn" class="btn btn-primary">Start Game</button>
                <button id="allow-camera-btn" class="btn btn-secondary">Allow Camera</button>
            </div>
            <div id="camera-status" class="status-message"></div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="score-display">
                    <span>Skor: <span id="current-score">0</span></span>
                    <span>High Score: <span id="high-score">0</span></span>
                </div>
                <div class="timer-display">
                    <span>Waktu: <span id="timer">60</span>s</span>
                </div>
                <button id="pause-btn" class="btn btn-small">⏸ Pause</button>
            </div>
            
            <div class="game-area">
                <canvas id="game-canvas"></canvas>
                <video id="video" autoplay playsinline></video>
                <canvas id="face-canvas"></canvas>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <h1 class="game-title">Game Over! 🎉</h1>
            <div class="score-summary">
                <p class="final-score">Skor Akhir: <span id="final-score">0</span></p>
                <p class="high-score-text">Skor Tertinggi: <span id="end-high-score">0</span></p>
            </div>
            <div class="button-group">
                <button id="replay-btn" class="btn btn-primary">Main Lagi</button>
                <button id="home-btn" class="btn btn-secondary">Kembali ke Menu</button>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen overlay">
            <div class="pause-content">
                <h2>⏸ Game Paused</h2>
                <button id="resume-btn" class="btn btn-primary">Resume</button>
                <button id="quit-btn" class="btn btn-secondary">Quit</button>
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="assets/music/JINGLE BURGER BANGOR - BURGERNYA INDONESIA.mp3" type="audio/mpeg">
    </audio>

    <!-- Game Completed Sound Effect -->
    <audio id="game-completed-sound">
        <source src="assets/music/mixkit-game-level-completed-2059.wav" type="audio/wav">
    </audio>

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <!-- Game Scripts -->
    <script src="camera.js"></script>
    <script src="faceDetection.js"></script>
    <script src="gameLogic.js"></script>
    <script src="main.js"></script>
</body>
</html>
